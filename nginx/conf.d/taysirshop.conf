# Etape 1/2 du tout premier lancement : AVANT d'avoir un certificat, nginx ne
# peut pas demarrer avec un bloc "listen 443 ssl" qui pointe vers des
# fichiers .pem qui n'existent pas encore (oeuf-poule classique). C'est
# pour ca que CE fichier (HTTP uniquement) est celui actif par defaut : le
# vrai "taysirshop.conf.full" (avec le bloc HTTPS) attend juste a cote.
#
# Marche a suivre au tout premier deploiement (voir PRODUCTION_STACK.md §1) :
#   1. docker compose -f docker-compose.prod.yml up -d nginx   (utilise ce fichier)
#   2. lancer certbot (commande dans PRODUCTION_STACK.md) pour obtenir le certificat
#   3. cp taysirshop.conf.full taysirshop.conf   (bascule vers la version HTTPS)
#   4. docker compose -f docker-compose.prod.yml restart nginx
#
# Les renouvellements automatiques suivants (tous les ~90 jours, geres par
# le conteneur certbot) n'ont plus besoin de ce fichier : le certificat
# existe deja et taysirshop.conf pointe vers le bloc HTTPS.

server {
    listen 80;
    server_name taysirshop.shop www.taysirshop.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://prestashop:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
